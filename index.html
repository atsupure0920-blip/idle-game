<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅の劇団">
  <meta name="theme-color" content="#ecebe7">
  <title>旅の劇団（灰色試作）</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <link rel="stylesheet" href="style.css?v=build-11">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-stage"><small>次の面</small><b data-testid="hud-stage">-</b></div>
      <div class="hud-res">
        <span class="res"><small>おひねり</small><b data-testid="hud-gold">0</b></span>
        <span class="res"><small>通常券</small><b data-testid="hud-tickets">0</b></span>
        <span class="res"><small>高級券</small><b data-testid="hud-premium">0</b></span>
      </div>
      <div id="hud-debug"></div>
      <button type="button" class="hud-btn" data-action="tab" data-tab="other" data-testid="tab-other" aria-label="その他（旅の記録と設定）">≡</button>
    </header>

    <button type="button" class="notice" data-testid="notice" data-action="dismiss-notice" hidden></button>

    <section id="journey" data-testid="journey">
      <div id="field" class="field" data-testid="field"></div>
      <div id="journey-info" class="journey-info"></div>
    </section>

    <main id="panel" class="panel" data-testid="panel" hidden></main>

    <nav id="tabs" class="tabs"></nav>
  </div>
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="app.js?v=build-11"></script>
</body>
</html>
