# 規模の見積もり（Claude が書く）。GAME_BRIEF.yaml の limits に収まることを、S1 の出口で検査する。
# 第3版（2026-10-12）: 団員24人（★1〜★3）、2種類の勧誘、装備、編成6人。

days_of_content: 7

# 画像の枚数（合計）。内訳は下
images: 70
image_breakdown:
  members_human: 24       # 団員（★1 8人、★2 8人、★3 5人、エリート 3人）
  companions: 4           # 相棒（ボスの絵を兼ねる）
  enemies: 6              # 雑魚敵（色替えで12種にする）
  backgrounds: 4          # 章ごとの背景
  equipment: 12           # 装備（4か所 × ★1〜★3）
  icons: 18               # 通貨、チケット2種、相棒の素材4つ、箱、役割、ボタン類
  title: 2                # タイトルとロゴ

# 画面の数
screens: 9
screen_list:
  - 旅（挑戦、戦闘の表示、放置報酬の箱）
  - 団員の一覧（稽古）
  - 団員の詳細（レベルの指定、リセット、昇格、装備）
  - 相棒（育成と底上げ）
  - 編成（団員6人と相棒1体）
  - 勧誘（通常と高級）
  - ミッション（一度きりの目標と日課）
  - 章の一覧
  - 設定（セーブの書き出しと読み込み）

# 仕組み
systems:
  - 旅（挑戦と初クリア報酬）
  - 放置報酬
  - 団員（勧誘、編成）
  - 育成（レベル上げ、リセット、昇格）
  - 相棒
  - 装備
  - ミッション（一度きりの目標と日課）

chapters: 4
stages_per_chapter: 10
