# 規模の見積もり（Claude が書く）。GAME_BRIEF.yaml の limits に収まることを、S1 の出口で検査する。
# 第2版（2026-10-11）: 相棒、ミッション、日課を足した。

days_of_content: 7

# 画像の枚数（合計）。内訳は下
images: 40
image_breakdown:
  members_human: 7        # 人間の団員
  companions: 4           # 相棒（ボスの絵を兼ねる）
  enemies: 6              # 雑魚敵（色替えで12種にする）
  backgrounds: 4          # 章ごとの背景
  icons: 17               # 通貨、チケット、相棒の素材4つ、箱、役割、ボタン類
  title: 2                # タイトルとロゴ

# 画面の数
screens: 9
screen_list:
  - 旅（挑戦、戦闘の表示、放置報酬の箱）
  - 団員の一覧（稽古、昇格）
  - 団員の詳細
  - 相棒（育成と底上げ）
  - 編成（団員4人と相棒1体）
  - 勧誘
  - ミッション（一度きりの目標と日課）
  - 章の一覧
  - 設定（セーブの書き出しと読み込み）

# 仕組み
systems:
  - 旅（挑戦と初クリア報酬）
  - 放置報酬
  - 団員（勧誘、編成）
  - 育成（レベル上げと昇格）
  - 相棒
  - ミッション（一度きりの目標と日課）

chapters: 4
stages_per_chapter: 10
