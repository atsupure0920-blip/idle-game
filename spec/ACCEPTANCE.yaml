# 合否の数字（第3版。スクリプトが合否の判定に使う）
#
# 第3版（編成6人、★1〜★3、2種類の勧誘、装備、リセット）に合わせて、Claude が置き直した初期値。
# 今回は、build-5 のユーザーの実プレイ（44分、確認用の機能なし。feedback/F-011.md）を根拠にした項目がある。
# 保護ファイル。変えるにはユーザーの承認が要る。

status: approved         # draft（未決定）| approved（承認済み）  ← 2026-10-12 第3版を承認

players: [optimal, normal, lazy]
seeds: 100

# 最初の30分（速度変更なし、続けて遊んだ場合）
first_30min:
  # 到達した面の通し番号。build-5 の実プレイは 23面目（3-3）
  stage_reached:        { normal_p50: [18, 26], lazy_p10_min: 10 }
  # 初めて負けるまでの分数。2章の終わりまでは止めない。build-5 の実プレイは 9.8分（3-1）
  first_defeat_min:     { normal_p50: [9, 25] }
  # 初めてボスが相棒になるまでの分数。build-5 の実プレイは 4.8分
  first_companion_min:  { normal_p50: [4, 10] }
  # 編成の6枠が埋まるまでの分数（最初の高級10連で埋まる）
  party_full_min:       { normal_p50_max: 3 }
  # 最初の10分に勧誘した回数（序盤に、たくさん回せること）。build-5 の実プレイは 21回
  recruits_10min:       { normal_p50_min: 30 }
  # 30分後に持っている団員の数（24人のうち）
  members_owned:        { normal_p50: [12, 22] }
  # 30分後に、編成の6人が付けている装備の数（4か所 × 6人 = 24か所のうち）
  equipped_slots:       { normal_p50_min: 16 }
  # 新しい面を突破できなかった時間の最長（分）。build-5 の実プレイは 11.3分（3-1 で止まった）。次は10分以内を目標にする
  longest_stall_min:    { normal_p90_max: 10 }
  # 1分あたりの操作の回数。build-5 の実プレイは 5.6回
  taps_per_min:         { normal_p50: [2, 15] }

# 30分遊んだあと、8時間あけて戻り、10分遊んだとき
return_after_8h:
  # 戻ってからの10分で、新しく突破した面の数。うれしい程度には進み、素通りにはならない
  stages_gained_10min:  { normal_p50: [2, 6] }

# 7日目。G1 の後で決める
day7: {}
