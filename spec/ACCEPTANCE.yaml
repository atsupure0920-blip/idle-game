# 合否の数字（第2版。スクリプトが合否の判定に使う）
#
# 核の循環の作り直し（挑戦ボタン、時間でたまる放置報酬、相棒、ミッション）に合わせて、Claude が置き直した初期値。
# 根拠のある数字ではない。ユーザーの実プレイの記録と食い違ったときは、ユーザーの記録を正として直す。
# 保護ファイル。変えるにはユーザーの承認が要る。

status: approved         # draft（未決定）| approved（承認済み）  ← 2026-10-11 第2版を承認

players: [optimal, normal, lazy]   # 模擬プレイの行動: 熱心 / ふつう / あまり開かない
seeds: 100

# 最初の30分（速度変更なし、続けて遊んだ場合）
first_30min:
  # 到達した面の通し番号（1-1 が 1、2-1 が 11）。ふつうの人の中央値が、第2章の終わりから第3章の中ほど
  stage_reached:        { normal_p50: [18, 26], lazy_p10_min: 10 }
  # 初めて負けるまでの分数。序盤では止めない（第1章では負けない）
  first_defeat_min:     { normal_p50: [12, 25] }
  # 初めてボスを倒して、相棒になるまでの分数
  first_companion_min:  { normal_p50: [5, 10] }
  # 最初の10分に勧誘した回数（序盤に、たくさん回せること）
  recruits_10min:       { normal_p50_min: 8 }
  # 持っている団員の数（人間は7人まで）
  members_owned:        { normal_p50: [5, 7] }
  # 新しい面を突破できなかった時間の最長（分）
  longest_stall_min:    { normal_p90_max: 6 }
  # 1分あたりの操作の回数（少なすぎず、忙しすぎない）
  taps_per_min:         { normal_p50: [2, 15] }

# 30分遊んだあと、8時間あけて戻り、10分遊んだとき
# （build-4 では、8時間ぶんの放置報酬で第2章が素通りになった。それを防ぐための数字）
return_after_8h:
  # 戻ってからの10分で、新しく突破した面の数。うれしい程度には進み、素通りにはならない
  stages_gained_10min:  { normal_p50: [2, 6] }

# 7日目。G1 の後で決める
day7: {}
