# ゲームの仕様（あなたが書く唯一のファイル）
#
# 書き方:
#   - ★ の4項目が必須。ほかは空欄や既定値のままで進められます。
#   - 「: 」の右側だけを書き換えます。文は "..." の中に書きます。
#   - このファイルを直接編集しなくても、チャットで答えを伝えてもらえれば Claude が書き込みます。
#   - G3（範囲の凍結）までは、いつでも書き換えられます。

concept:
  # ★ 型。chest（箱を開けて装備を集める型）| card（キャラを集めて編成する型）| tap（タップで育てる型）
  base_type: chest

  # ★ 題材を1文で。  例: "深夜のコンビニで働く妖怪たち"
  theme: ""

  # 雰囲気。comic（コミカル）| cute（かわいい）| cool（かっこいい）| dark（ダーク）
  tone: comic

  # ★ 参考にする既存作を1〜3つ。take は「何を参考にしたいか」。空でも構いません。
  references:
    - { title: "", take: "" }

  # 他と違う点を1文で。空欄で構いません。S1 で Claude が3案を出すので、そこから選べます。
  hook: ""

feel:
  # 1回に遊ぶ時間（分）と、1日に開く回数の想定
  session_minutes: 3
  sessions_per_day: 4
  # 画面の向き。portrait（縦）| landscape（横）
  orientation: portrait

art:
  # ★ 絵柄を表す言葉。  例: "太い線、フラット塗り、2頭身、丸い形"
  style_words: ""
  # 色の方向。空でも構いません。  例: "夜の紺とネオンの黄"
  palette: ""

limits:
  # 上限。この範囲に収まる規模を Claude が逆算します。まずは変えないことを勧めます。
  days_of_content: 7      # 何日分の内容を作るか
  max_images: 40          # 画像の枚数
  max_screens: 8          # 画面の数
  max_systems: 4          # 仕組みの数（箱、ステージ進行、放置報酬 など）

done:
  # 完成の定義。1作目は web（公開URLで遊べる、無課金、広告なし）で固定です。
  definition: web

ng:
  # やらないこと・入れたくないもの。自由に書けます。  例: "流血表現"
  - ""
