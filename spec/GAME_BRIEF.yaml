# ゲームの仕様（あなたが書く唯一のファイル）
#
# 書き方:
#   - ★ の4項目が必須。ほかは空欄や既定値のままで進められます。
#   - 「: 」の右側だけを書き換えます。文は "..." の中に書きます。
#   - このファイルを直接編集しなくても、チャットで答えを伝えてもらえれば Claude が書き込みます。
#   - G3（範囲の凍結）までは、いつでも書き換えられます。

concept:
  # ★ 型。chest（箱を開けて装備を集める型）| card（キャラを集めて編成する型）| tap（タップで育てる型）
  base_type: card

  # ★ 題材を1文で。
  theme: "旅する小さな劇団の団員たちが、魔物退治の旅をする。"

  # 雰囲気。comic（コミカル）| cute（かわいい）| cool（かっこいい）| dark（ダーク）
  tone: cute

  # ★ 参考にする既存作を1〜3つ。take は「何を参考にしたいか」。
  references:
    - { title: "Idle Heroes", take: "放置報酬、ステージ進行のテンポ" }

  # 他と違う点を1文で。（3案から Claude が選んだ。G0 で承認か却下を決める）
  hook: "倒したボスの魔物が改心して、劇団の団員になる。"

feel:
  # 1回に遊ぶ時間（分）と、1日に開く回数の想定
  session_minutes: 3
  sessions_per_day: 4
  # 画面の向き。portrait（縦）| landscape（横）
  orientation: portrait

art:
  # ★ 絵柄を表す言葉。
  style_words: >-
    やさしく可愛いデフォルメ絵柄で、2.5頭身前後、頭大きめ・手足短め、全体は丸く柔らかい形で描く。
    線は濃いブラウン（#6A5242）でやや太め、外周を少し太くし、内部線は細めで強弱は弱め。
    塗りはアニメ塗り寄りの1段影＋必要に応じて2段目少量、グラデーションは控えめ、目と髪に小さく柔らかいハイライト。
    UIやアイコンは角丸・記号的・シンプルにまとめ、黒すぎる線、厚塗り、強すぎるコントラスト、リアル寄り表現は避ける。
  # 色の方向。
  palette: "クリーム、ベージュ、ピーチピンク、ブロンド、やさしいネイビー、空色を中心にした高明度パステル調"

limits:
  # 上限。この範囲に収まる規模を Claude が逆算します。
  days_of_content: 7      # 何日分の内容を作るか
  max_images: 40          # 画像の枚数
  max_screens: 8          # 画面の数
  max_systems: 4          # 仕組みの数

done:
  # 完成の定義。1作目は web（公開URLで遊べる、無課金、広告なし）で固定です。
  definition: web

ng:
  # やらないこと・入れたくないもの。
  - "黒すぎる線、厚塗り、強すぎるコントラスト、リアル寄りの表現"
